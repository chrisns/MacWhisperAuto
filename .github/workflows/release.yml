name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: Generate version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semantic_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        uses: lukaszraczylo/semver-generator@888415366ad365c38329a9db6fdac96b724d43d8 # v1
        with:
          config_file: semver.yaml
          repository_local: true
          strict: true

  release:
    name: Build & Release
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Build .app bundle
        env:
          VERSION: ${{ needs.version.outputs.semver }}
        run: scripts/build.sh

      - name: Zip .app bundle
        run: |
          cd build
          zip -r MacWhisperAuto.app.zip MacWhisperAuto.app

      - name: Compute SHA256
        id: sha256
        run: echo "hash=$(shasum -a 256 build/MacWhisperAuto.app.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Zip browser extension
        run: zip -r MacWhisperAuto-Extension.zip Extension/

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.semver }}" \
            build/MacWhisperAuto.app.zip \
            MacWhisperAuto-Extension.zip \
            --title "MacWhisperAuto v${{ needs.version.outputs.semver }}" \
            --generate-notes \
            --target "${{ github.sha }}"

      - name: Update Homebrew tap
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not configured; skipping Homebrew tap update."
            echo "To enable, create a PAT with 'workflow' scope for chrisns/homebrew-macwhisperauto and set it as the HOMEBREW_TAP_TOKEN repo secret."
            exit 0
          fi
          gh workflow run update.yml \
            --repo chrisns/homebrew-macwhisperauto \
            --field version="${{ needs.version.outputs.semver }}" \
            --field sha256="${{ steps.sha256.outputs.hash }}"
